<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AB InterVue AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            margin-top: 100px;
        }

        h1 {
            color: #2c3e50;
        }

        p {
            color: #555;
            font-size: 20px;
        }

        input {
            padding: 10px;
            width: 250px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <h1>Welcome to AB InterVue AI</h1>

    <p>AI-Powered Interview Preparation Platform</p>

    <form action="/interview" method="POST">

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >

        <br><br>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <br><br>

        <button type="submit">Start Interview</button>

    </form>

</body>
</html>
